<style>
:root{--bg:#EDF0F3;--surface:#fff;--ink:#16202B;--muted:#586573;--line:#D6DCE3;--accent:#0B7A75;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1419;--surface:#171F27;--ink:#E8EDF2;--muted:#9DAAB8;--line:#2A3643;--accent:#3CC6BE}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;padding:20px}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:4px;padding:28px 26px}
h1{margin:0 0 6px;font-size:2rem;letter-spacing:-.01em}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.keep{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted);margin:12px 0 16px;font-size:.92rem}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
#msg{margin:12px 0 0;min-height:1.4em;color:#C62828;font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Fall 2026</h1>
  <p>Enter the password to open the dashboard.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="keep"><input type="checkbox" id="keep" checked> Keep me unlocked on this device</label>
    <button id="go" type="submit">Unlock</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const saved=localStorage.getItem(KEYSTORE);
    if(saved){
      const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']);
      await openWith(key);
    }
  }catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  msg.textContent='';btn.disabled=true;btn.textContent='Unlocking…';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    const key=await deriveKey(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){
      try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}
    }
    await openWith(key);
  }catch(e){
    try{localStorage.removeItem(KEYSTORE)}catch(_){}
    msg.textContent=e.message==='nocrypto'?'This browser cannot unlock the page over an insecure connection. Use the https address.':'Wrong password.';
    btn.disabled=false;btn.textContent='Unlock';
  }
});
